<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orrery | Interactive 3D Solar System</title>

<meta name="description" content="An interactive 3D model of the solar system that runs in the browser. See the planets and moons on any date, fly around, and explore exoplanet systems.">
<meta name="author" content="Team Jarvis">
<link rel="canonical" href="https://orrery.jarvisar.com/">
<meta name="theme-color" content="#05070f">
<meta name="color-scheme" content="dark">

<!-- Installed to a home screen: full screen, no browser chrome. The status bar
     draws over the scene, and the interface already leaves room for it. -->
<meta name="application-name" content="Orrery">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orrery">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Link previews need absolute URLs, so these point at the live site. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Orrery">
<meta property="og:url" content="https://orrery.jarvisar.com/">
<meta property="og:title" content="Orrery | Interactive 3D Solar System">
<meta property="og:description" content="An interactive 3D model of the solar system with real orbits, the real sky and exoplanet systems.">
<meta property="og:image" content="https://orrery.jarvisar.com/public/screenshots/wide.webp">
<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="1000">
<meta property="og:image:alt" content="The whole solar system, with every orbit drawn">
<meta name="twitter:card" content="summary_large_image">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Orrery",
  "url": "https://orrery.jarvisar.com/",
  "description": "An interactive 3D model of the solar system that runs in the browser. See the planets and moons on any date, fly around, and explore exoplanet systems.",
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Any",
  "browserRequirements": "Requires JavaScript and WebGL",
  "image": "https://orrery.jarvisar.com/public/screenshots/wide.webp",
  "author": { "@type": "Person", "name": "Team Jarvis" },
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}
</script>

<link rel="icon" type="image/svg+xml" href="public/icon/orrery.svg">
<link rel="apple-touch-icon" sizes="180x180" href="public/icon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="public/icon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="public/icon/favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="preload" as="font" type="font/woff2" href="public/fonts/inter.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="public/fonts/jost.woff2" crossorigin>

<!-- The first three textures the loading screen waits on, requested before the
     module graph has even been parsed. Only when the network is serving them.
     Chrome will not match a preload to a request the service worker answers,
     so on an installed or returning visit they would just be read twice. The
     images are preloaded as fetches because that is how src/core/AssetLoader.js
     requests them, to decode them itself. An image preload would go unused. -->
<script>
  // The desktop app (desktop/) reads them from disk, where a preload is a second read.
  if (!navigator.serviceWorker?.controller && !window.orreryDesktop) {
    for (const href of [
      'public/textures/manifest.json',
      'public/textures/stars_milkyway.webp',
      'public/textures/sun.webp',
    ]) {
      document.head.append(Object.assign(document.createElement('link'),
        { rel: 'preload', as: 'fetch', href, crossOrigin: 'anonymous' }));
    }
  }
</script>

<!-- three.js is vendored under vendor/, not pulled from a CDN at runtime.
     Run `npm run vendor` after bumping the version in package.json. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="src/main.js"></script>
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Orrery",
    "url": "https://orrery.jarvisar.com/"
  }
</script>
<!-- Cloudflare Web Analytics. Only on the live site, so local dev and the desktop app aren't counted -->
<script>
  if (location.hostname === 'orrery.jarvisar.com') {
    const beacon = document.createElement('script');
    beacon.type = 'module';
    beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
    beacon.dataset.cfBeacon = '{"token": "a52a84e110ba48c0868dd4ae87e235b7"}';
    document.head.appendChild(beacon);
  }
</script>
</head>

<body>
<canvas id="viewport" aria-label="Interactive 3D solar system"></canvas>

<!-- Static so it paints before any JavaScript runs. -->
<div id="loading" class="loading" role="status" aria-live="polite">
  <div class="loading__inner">
    <div class="loading__orbit" aria-hidden="true">
      <span class="loading__ring loading__ring--3"></span>
      <span class="loading__ring loading__ring--2"></span>
      <span class="loading__ring loading__ring--1"></span>
      <span class="loading__sun"></span>
    </div>
    <h1 class="loading__title">Orrery</h1>
    <div class="loading__track"><div class="loading__bar" id="loading-bar"></div></div>
    <p class="loading__status" id="loading-status">Starting up…</p>
  </div>
</div>

<div id="ui" class="ui" hidden></div>

<noscript>
  <div class="fallback">
    <h1>Orrery</h1>
    <p>This is a real-time 3D simulation, so it needs JavaScript enabled.</p>
    <p class="fallback__hint"><a href="about/">About Orrery</a> · <a href="systems/">Exoplanet systems</a></p>
  </div>
</noscript>

<div id="unsupported" class="fallback" hidden>
  <h1>WebGL unavailable</h1>
  <p>This browser could not create a WebGL context, so the simulation cannot run.</p>
  <p class="fallback__hint">Enabling hardware acceleration in your browser settings usually fixes it.</p>
</div>
</body>
</html>
