<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orrery — An Interactive Solar System</title>

<meta name="description" content="An interactive 3D model of the solar system. Real orbital elements, real scale relationships, and a free-flight mode — built with three.js.">
<meta name="author" content="Adam Jarvis">
<meta name="theme-color" content="#05070f">
<meta name="color-scheme" content="dark">

<meta property="og:type" content="website">
<meta property="og:title" content="Orrery — An Interactive Solar System">
<meta property="og:description" content="An interactive 3D model of the solar system, driven by real orbital elements.">

<link rel="apple-touch-icon" sizes="180x180" href="public/icon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="public/icon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="public/icon/favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="style.css">

<!-- The first three textures the loading screen waits on, requested before the
     module graph has even been parsed. -->
<link rel="preload" as="fetch" href="public/textures/manifest.json">
<link rel="preload" as="image" href="public/textures/stars_milkyway.webp" crossorigin="anonymous">
<link rel="preload" as="image" href="public/textures/sun.webp" crossorigin="anonymous">

<!-- three.js is vendored under vendor/, not pulled from a CDN at runtime.
     Run `npm run vendor` after bumping the version in package.json. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="src/main.js"></script>
</head>

<body>
<canvas id="viewport" aria-label="Interactive 3D solar system"></canvas>

<!-- Static so it paints before any JavaScript runs. -->
<div id="loading" class="loading" role="status" aria-live="polite">
  <div class="loading__inner">
    <div class="loading__orbit" aria-hidden="true">
      <span class="loading__sun"></span>
      <span class="loading__planet"></span>
    </div>
    <h1 class="loading__title">Orrery</h1>
    <p class="loading__subtitle">An interactive solar system</p>
    <div class="loading__track"><div class="loading__bar" id="loading-bar"></div></div>
    <p class="loading__status" id="loading-status">Starting up…</p>
  </div>
</div>

<div id="ui" class="ui" hidden></div>

<noscript>
  <div class="fallback">
    <h1>Orrery</h1>
    <p>This is a real-time 3D simulation, so it needs JavaScript enabled.</p>
  </div>
</noscript>

<div id="unsupported" class="fallback" hidden>
  <h1>WebGL unavailable</h1>
  <p>This browser could not create a WebGL context, so the simulation cannot run.</p>
  <p class="fallback__hint">Enabling hardware acceleration in your browser settings usually fixes it.</p>
</div>
</body>
</html>
