name: Deploy to GitHub Pages

# The site is plain ES modules with an import map and no build step, so this
# workflow does not compile anything. It stages the files that are actually
# served — leaving out the dev server, the asset pipeline and the README
# screenshots — verifies them, and hands the result to Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it: a half-deployed
# Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the build
        # Catches the failure modes a bundler would normally catch for us:
        # a syntax error, a stale vendored three.js, a texture in the
        # catalogue that is not actually shipped.
        run: npm run check

      - name: Check the exoplanet model
        # Against the committed catalogues, before they are refreshed, so these
        # named-system tests only ever fail for a change to the code.
        run: npm run exoplanets:test

      - name: Refresh the offline exoplanet catalogue
        # Also runs weekly (the schedule above). The importer replaces the
        # committed copy only once the new one has passed its own checks, so an
        # archive outage or a bad response ships last week's data instead.
        continue-on-error: true
        run: npm run exoplanets:update

      - name: Refresh stellar companion data
        continue-on-error: true
        run: npm run stars:update

      - name: Check the catalogues being shipped
        # Independent of which systems they hold: every one must still build a
        # finite model that keeps all of its planets.
        run: npm run exoplanets:verify

      - name: Stage the site
        # Copies the files listed in scripts/lib/served.js - the same list the
        # desktop app is packaged from.
        run: |
          node scripts/stage.js _site
          # Pages serves the artifact as-is, but this keeps the site working
          # if the source is ever switched back to branch deployment.
          touch _site/.nojekyll

      - name: Stamp the service worker
        # Lists every staged file, with a content hash, in _site/sw.js, so
        # installed copies precache exactly this release and work offline.
        run: node scripts/stamp-sw.js _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
