name: Checks

# Runs the same verification the deploy does, but on pull requests, so a broken
# reference is caught before it reaches main rather than on the way out to Pages.

on:
  pull_request:
  push:
    branches-ignore: [main] # main is already covered by the deploy workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run exoplanets:test
      - run: npm run exoplanets:smoke -- --strict

      - name: Check that the site boots
        # A syntax check cannot tell you the app throws on startup. This loads
        # the real page in headless Chrome (the one preinstalled on the runner,
        # so nothing has to download a browser) and fails on any uncaught error,
        # any failed request, or a loading screen that never lifts.
        run: npm run smoke -- --strict

      - name: Check the layout at common screen sizes
        # Ten viewports from a 320px phone to 1080p, each with every panel
        # open: nothing off screen or overlapping, touch-sized targets, a
        # visible focus ring on every Tab stop, readable contrast on the
        # plates, and axe-core's WCAG 2.2 AA rules at one phone and one desktop.
        run: npm run responsive -- --strict

      - name: Check VR with an emulated headset
        # IWER stands in for a Quest 3, so the whole VR path runs in headless
        # Chrome: controllers, hands, the panel by ray and by fingertip, the
        # palm gesture, recentring, and leaving VR with the page intact.
        run: npm run vr -- --strict

      - name: Check game controllers
        # Stands in for the Gamepad API with a pad this script presses: every
        # binding, moving round the menus and Settings with the D-pad, full
        # screen with and without a key press to go on, another make's labels,
        # and the legend clear of the interface at three screen sizes.
        run: npm run gamepad -- --strict
